<div class="modal">
  <div class="modal-content">
    <h2>Editar producto</h2>

    <form #miForm="ngForm" (ngSubmit)="onGuardar(miForm)">
      <label>Nombre:</label>
      <input type="text" [(ngModel)]="nombre" name="nombre" required>

      <label>Precio:</label>
      <input type="number" [(ngModel)]="precio" name="precio" min="0" required>

      <label>
        <input type="checkbox" [(ngModel)]="disponible" name="disponible">
        Disponible
      </label>

      <div class="botones">
        <button type="button" (click)="cerrar.emit()">Cancelar</button>
        <button type="submit" [disabled]="miForm.invalid">Guardar</button>
      </div>
    </form>
  </div>
</div>
